<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Heart Studio — 100 Styles / 4K</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080611;color:#f7f1ff;font:14px/1.45 system-ui,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:minmax(260px,330px) 1fr;min-height:100vh}.panel{padding:20px;background:#110d1d;border-right:1px solid #33213e;overflow:auto}.panel h1{font-size:22px;margin:0 0 5px}.sub{color:#bca9ca;margin:0 0 18px}label{display:block;margin:13px 0 5px;color:#ddcde9}input,select,button{width:100%;font:inherit;color:#fff;background:#21172d;border:1px solid #51385e;border-radius:9px;padding:10px}input[type=color]{height:42px;padding:4px}button{cursor:pointer;font-weight:650;background:linear-gradient(110deg,#a51b82,#542ad0);border:0;margin-top:10px}button.secondary{background:#2a2038;border:1px solid #60486d}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{min-width:0;display:flex;flex-direction:column;padding:18px;gap:12px}.stage{flex:1;min-height:380px;background:#030208;border:1px solid #392645;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{width:100%;height:100%;max-height:calc(100vh - 95px);object-fit:contain}.meta{display:flex;justify-content:space-between;gap:12px;color:#bca9ca;flex-wrap:wrap}.note{font-size:12px;color:#a994b9;margin-top:12px}.pill{display:inline-block;background:#291b36;border-radius:20px;padding:4px 8px;color:#f0c9ff}@media(max-width:800px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #33213e}.stage{height:55vh;min-height:300px}canvas{max-height:55vh}}
</style></head><body><div class="app"><aside class="panel"><h1>💗 Love Heart Studio</h1><p class="sub">100 styles · 4K canvas · video recorder</p>
<label for="style">Animation style (100)</label><select id="style"></select><div class="grid"><div><label for="text">Heart text</label><input id="text" value="I LOVE YOU" maxlength="48"></div><div><label for="seed">Style variation</label><input id="seed" type="number" min="1" max="100" value="1"></div></div>
<div class="grid"><div><label for="color">Main color</label><input id="color" type="color" value="#ff39b8"></div><div><label for="bg">Background</label><input id="bg" type="color" value="#08020f"></div></div>
<label for="density">Particles <span id="densityVal">800</span></label><input id="density" type="range" min="150" max="1800" step="50" value="800">
<label for="speed">Animation speed <span id="speedVal">1.0×</span></label><input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1">
<label for="resolution">Canvas resolution</label><select id="resolution"><option value="preview">Preview (fast)</option><option value="1080">Full HD · 1920×1080</option><option value="4k" selected>4K · 3840×2160</option></select>
<label for="duration">Recording duration</label><select id="duration"><option value="5">5 seconds</option><option value="8">8 seconds</option><option value="10">10 seconds</option><option value="15">15 seconds</option><option value="20" selected>20 seconds</option><option value="25">25 seconds</option><option value="30">30 seconds</option></select>
<button id="apply">Apply style / update text</button><div class="grid"><button id="random" class="secondary">Random style</button><button id="pause" class="secondary">Pause</button></div><button id="record">● Record video</button><button id="png" class="secondary">Save still image (PNG)</button>
<p class="note">ভিডিও রেকর্ডিং WebM ফরম্যাটে সেভ হবে। MP4 বানাতে নিচের FFmpeg কমান্ড ব্যবহার করুন। 4K recording ধীর হলে Full HD নির্বাচন করুন।</p></aside>
<main class="preview"><div class="meta"><span><span class="pill" id="styleName">Style 01</span> <span id="status">Animating</span></span><span id="dimensions">3840 × 2160 canvas</span></div><div class="stage"><canvas id="c" width="3840" height="2160"></canvas></div><div class="meta"><span>HTML + CSS + JavaScript · No libraries required</span><span>Local browser rendering</span></div></main></div>
<script>
const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d',{alpha:false});let W=3840,H=2160,paused=false,raf=0,t0=performance.now(),seed=1,particles=[],recording=false;
const names=['Neon Orbit','Rose Gold','Cyber Pulse','Galaxy Heart','Pixel Rain','Electric Pink','Aurora Wave','Velvet Glow','Starfield','Laser Grid','Dream Dust','Crystal Heart','Bubble Love','Digital Rain','Flame Aura','Moonlight','Cosmic Dust','Prism Glow','Soft Romance','Electric Blue'];
for(let i=1;i<=100;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0')+' — '+(names[(i-1)%names.length])+(i>20?' '+Math.ceil(i/20):'');$('style').appendChild(o)}
function rand(i){let x=Math.sin(i*127.1+seed*311.7)*43758.5453;return x-Math.floor(x)}
function heart(t){return {x:16*Math.pow(Math.sin(t),3),y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}}
function build(){seed=+$('style').value||1;$('seed').value=seed;let n=+$('density').value;particles=Array.from({length:n},(_,i)=>{let a=rand(i+seed*13)*Math.PI*2,p=rand(i+900+seed)*.98+.02;let h=heart(a);return {a,p,x:h.x,y:h.y,z:rand(i+300)*2-1,size:2+rand(i+600)*7,phase:rand(i+1000)*Math.PI*2,speed:.3+rand(i+2000)*1.5,kind:Math.floor(rand(i+3000)*5)}});$('styleName').textContent='Style '+String(seed).padStart(2,'0')+' · '+names[(seed-1)%names.length];}
function resize(){let r=$('resolution').value;if(r==='4k'){W=3840;H=2160}else if(r==='1080'){W=1920;H=1080}else{W=1280;H=720}canvas.width=W;canvas.height=H;$('dimensions').textContent=W+' × '+H+' canvas';}
function draw(now){raf=requestAnimationFrame(draw);if(paused)return;let time=(now-t0)*.001*(+$('speed').value),hue=(seed*37)%360,col=$('color').value,bg=$('bg').value;ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let cx=W*.5,cy=H*.48,scale=Math.min(W,H)*.026*(.92+Math.sin(time*1.6)*.025);let style=seed%10;ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
// Ambient halo
let glow=ctx.createRadialGradient(0,0,scale*1,0,0,scale*20);glow.addColorStop(0,hexRgba(col,.15));glow.addColorStop(1,hexRgba(col,0));ctx.fillStyle=glow;ctx.fillRect(-W/2,-H/2,W,H);
// Heart outline
ctx.beginPath();for(let i=0;i<=500;i++){let a=i/500*Math.PI*2,pt=heart(a);let x=pt.x*scale,y=pt.y*scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.strokeStyle=hexRgba(col,.45);ctx.lineWidth=Math.max(2,W/1400);ctx.shadowBlur=scale*.9;ctx.shadowColor=col;ctx.stroke();ctx.shadowBlur=0;
for(let i=0;i<particles.length;i++){let p=particles[i],a=p.a+time*(.12+(seed%7)*.018)*p.speed,pt=heart(a),inside=p.p;let pulse=1+Math.sin(time*2+p.phase)*.06;let x=pt.x*scale*inside*pulse,y=pt.y*scale*inside*pulse;let drift=Math.sin(time*p.speed+p.phase)*scale*(.08+style*.008);x+=Math.cos(a*3+time*.4)*drift;y+=Math.sin(a*2-time*.3)*drift;let sz=p.size*(W/3840)*(0.65+inside*.65);if(style===4){x=Math.round(x/12)*12;y=Math.round(y/12)*12}ctx.beginPath();if(p.kind===0){ctx.arc(x,y,sz,0,Math.PI*2)}else if(p.kind===1){ctx.rect(x-sz,y-sz,sz*2,sz*2)}else{ctx.moveTo(x,y-sz*1.5);ctx.lineTo(x+sz,y);ctx.lineTo(x,y+sz*1.5);ctx.lineTo(x-sz,y);ctx.closePath()}let alpha=.22+.7*rand(i+Math.floor(time*4)+seed);ctx.fillStyle=hexRgba(col,alpha);ctx.shadowBlur=sz*(2+(seed%4));ctx.shadowColor=col;ctx.fill();}
ctx.shadowBlur=0;
// Connecting wave strands
for(let line=0;line<4+(seed%6);line++){ctx.beginPath();for(let k=0;k<=220;k++){let a=k/220*Math.PI*2,pt=heart(a),r=.42+line*.075+Math.sin(a*(3+seed%5)+time*(.6+line*.08))*0.025;let x=pt.x*scale*r,y=pt.y*scale*r;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=hexRgba(col,.09+(line%3)*.035);ctx.lineWidth=Math.max(1,W/3000);ctx.stroke()}
ctx.restore();
// Text overlay
let txt=$('text').value||'I LOVE YOU';ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${Math.round(H*.075)}px Arial, sans-serif`;ctx.shadowColor=col;ctx.shadowBlur=H*.025;ctx.fillStyle='#fff3fb';ctx.fillText(txt,W/2,H*.49,W*.78);ctx.shadowBlur=0;ctx.font=`500 ${Math.round(H*.018)}px Arial,sans-serif`;ctx.fillStyle=hexRgba(col,.85);ctx.fillText('♥  FOREVER YOURS  ♥',W/2,H*.56,W*.7);ctx.restore();
// Small sparkles
for(let j=0;j<90;j++){let x=rand(j+seed*20)*W,y=rand(j+seed*40)*H,twinkle=(Math.sin(time*2+j)+1)*.5;if(twinkle>.92){ctx.fillStyle=hexRgba(col,(twinkle-.9)*8);ctx.fillRect(x,y,Math.max(2,W/1600),Math.max(2,W/1600))}}
}
function hexRgba(hex,a){let v=parseInt(hex.slice(1),16);return `rgba(${v>>16},${(v>>8)&255},${v&255},${Math.max(0,Math.min(1,a))})`}
$('apply').onclick=()=>{resize();build()};$('style').onchange=()=>{build()};$('seed').onchange=()=>{$('style').value=Math.max(1,Math.min(100,+$('seed').value||1));build()};$('density').oninput=()=>{$('densityVal').textContent=$('density').value};$('speed').oninput=()=>{$('speedVal').textContent=(+$('speed').value).toFixed(1)+'×'};$('random').onclick=()=>{$('style').value=1+Math.floor(Math.random()*100);build()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('status').textContent=paused?'Paused':'Animating'};
$('png').onclick=()=>{canvas.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='love-heart-style-'+String(seed).padStart(2,'0')+'.png';a.click();URL.revokeObjectURL(a.href)},'image/png')};
$('record').onclick=async()=>{if(recording)return;recording=true;let btn=$('record'),old=btn.textContent;btn.disabled=true;btn.textContent='Recording…';$('status').textContent='Recording';try{if(paused){paused=false;$('pause').textContent='Pause'}let stream=canvas.captureStream(30),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:W>=3840?25000000:12000000}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`love-heart-style-${String(seed).padStart(2,'0')}-${W}x${H}.webm`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);stream.getTracks().forEach(t=>t.stop());recording=false;btn.disabled=false;btn.textContent=old;$('status').textContent='Saved WebM'};rec.start(250);let seconds=+$('duration').value;btn.textContent='Recording '+seconds+'s…';setTimeout(()=>{if(rec.state!=='inactive')rec.stop()},seconds*1000)}catch(e){recording=false;btn.disabled=false;btn.textContent=old;$('status').textContent='Recording unsupported';alert('এই ব্রাউজারে recording চালু হয়নি। Chrome/Edge ডেস্কটপ ব্যবহার করুন।')}};
resize();build();requestAnimationFrame(draw);
</script></body></html>
